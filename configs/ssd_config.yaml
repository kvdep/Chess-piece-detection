# SSD300-VGG16 Configuration for Chess Piece Detection
model:
  name: "ssd300_vgg16"
  num_classes: 13       # 12 piece classes + 1 background class (id 0)
  input_size: [300, 300]
  pretrained_backbone: true

training:
  epochs: 15
  batch_size: 8
  optimizer:
    name: "AdamW"       # Replaced SGD due to gradient explosion instability
    lr: 0.0001
    weight_decay: 0.0005
  scheduler:
    name: "StepLR"
    step_size: 3
    gamma: 0.1

dataset:
  train_images: "datasets/images/train"
  train_labels: "datasets/labels/train"
  val_images: "datasets/images/test"
  val_labels: "datasets/labels/test"
  cache_file: "cache_ssd_train.pt"

augmentations:
  hsv_h: 0.015
  hsv_s: 0.01
  hsv_v: 0.01
  degrees: 3.0
  translate: 0.05
  scale: 0.05
  shear: 0.1
  perspective: 0.001
  fliplr: 0.3
  flipud: 0.0
